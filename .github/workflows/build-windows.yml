            }
            const fileVersion = version.split('.').slice(0, 4).join('.');
            core.setOutput('version', version);
            core.setOutput('file_version', fileVersion);
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'
