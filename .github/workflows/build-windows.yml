name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. v4.2.0.9)'
        required: true
        type: string

jobs:
  Build-Console:
    runs-on: windows-2019
    steps:
      - name: Extract version
        id: tag
        uses: actions/github-script@v6
        with:
          script: |
            let version;
            if (context.eventName === 'workflow_dispatch') {
              version = '${{ inputs.version }}'.replace(/^v/, '');
            } else {
              version = context.payload.ref.replace('refs/tags/v', '');
            }
            const fileVersion = version.split('.').slice(0, 4).join('.');
            core.setOutput('version', version);
            core.setOutput('file_version', fileVersion);
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'
          architecture: 'x86'
      - name: Install MinGW64
        uses: bwoodsend/setup-winlibs-action@v1
        with:
          architecture: i686
      - name: Install requirements
        run: |
          pip install wheel
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard
      - name: Add build info
        working-directory: Console
        run: |
          "BUILD_INFO = 'Windows v"+${{ steps.tag.outputs.version }}+" (32-bit)'" | Out-File -FilePath BuildInfo.py -Encoding UTF8
      - name: Build
        working-directory: Console
        run: |
          nuitka --standalone --windows-icon-from-ico=Resources/Core/Logo.ico `
                 --windows-company-name=HCC --windows-uac-admin --windows-disable-console `
                 --windows-product-name="PYCM Console" --windows-product-version=${{ steps.tag.outputs.file_version }} `
                 --windows-file-description="PYCM Console" --windows-file-version=${{ steps.tag.outputs.file_version }} `
                 --include-data-file=Translation/*.qm=Translation/ `
                 --enable-plugin=pyqt5 --enable-plugin=multiprocessing `
                 --assume-yes-for-downloads --disable-ccache --remove-output `
                 --output-dir=Build ConsoleMain.py
      - name: Check build
        working-directory: Console
        run: |
          if(!(Test-Path Build/ConsoleMain.dist/ConsoleMain.exe)){ exit 1 }
          Rename-Item Build/ConsoleMain.dist Console
      - name: Zip files
        uses: vimtor/action-zip@v1
        with:
          files: Console/Build/
          dest: PYCM-Console-Windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PYCM-Console-Windows
          path: PYCM-Console-Windows.zip
      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: PYCM-Console-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  Build-Client:
    runs-on: windows-2019
    steps:
      - name: Extract version
        id: tag
