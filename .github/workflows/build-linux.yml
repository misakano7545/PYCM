name: Build Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. v4.2.0.9)'
        required: true
        type: string

jobs:
  Build-Console:
    runs-on: ubuntu-22.04
    steps:
      - name: Extract version
        id: tag
        uses: actions/github-script@v6
        with:
          script: |
            let version;
            if (context.eventName === 'workflow_dispatch') {
              version = '${{ inputs.version }}'.replace(/^v/, '');
            } else {
              version = context.payload.ref.replace('refs/tags/v', '');
            }
            core.setOutput('version', version);
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'
          architecture: 'x64'
      - name: Install requirements
        run: |
          pip install wheel
          pip install -r requirements.txt
          pip install nuitka
      - name: Add build info
        working-directory: Console
        run: |
          echo "BUILD_INFO = 'Linux v${{ steps.tag.outputs.version }} (64-bit)'" > BuildInfo.py
      - name: Build
        working-directory: Console
        run: |
          nuitka --standalone \
                  --include-data-file=Translation/*.qm=Translation/ \
                  --enable-plugin=pyqt5 --enable-plugin=multiprocessing \
                  --assume-yes-for-downloads --disable-ccache --remove-output \
                  --output-dir=Build ConsoleMain.py
      - name: Zip files
        uses: vimtor/action-zip@v1
        with:
          files: Console/Build/
          dest: PYCM-Console-Linux.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PYCM-Console-Linux
          path: PYCM-Console-Linux.zip
      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: PYCM-Console-Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  Build-Client:
    runs-on: ubuntu-22.04
    steps:
      - name: Extract version
        id: tag
        uses: actions/github-script@v6
        with:
          script: |
            let version;
            if (context.eventName === 'workflow_dispatch') {
              version = '${{ inputs.version }}'.replace(/^v/, '');
            } else {
              version = context.payload.ref.replace('refs/tags/v', '');
            }
            core.setOutput('version', version);
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'
          architecture: 'x64'
      - name: Install requirements
        run: |
          pip install wheel
          pip install -r requirements.txt
          pip install nuitka
      - name: Add build info
        working-directory: Client
        run: |
          echo "BUILD_INFO = 'Linux v${{ steps.tag.outputs.version }} (64-bit)'" > BuildInfo.py
      - name: Build
        working-directory: Client
        run: |
          nuitka --standalone \
